[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
version = "0.8.0"

[workspace.dependencies]
bincode = "1.3.3"
bytemuck = "1.25.2"
# cfg-if = "1.0.3"
clap = { version = "4.3.0", default-features = false, features = ["derive", "help", "std"] }
com-policy-config = "0.6.0"
concat-string = "1.0.1"
const_format = { version = "0.2.34", default-features = false }
crossbeam = "0.8.4"
discord-rich-presence = "1.0.0"
eframe = { git = "https://github.com/bph1248/egui.git", branch = "mod", default-features = false, features = ["default_fonts", "wgpu"] }
# eframe = { path = "B:/dev/egui/crates/eframe", default-features = false, features = ["default_fonts", "wgpu"] }
fast_image_resize = { version = "6.0.0", features = ["image"] }
hotpath = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = "0.3.2"
linear-srgb = "0.6.12"
log = "0.4.17"
notify-debouncer-full = { version = "0.7.0", features = ["crossbeam-channel"] }
nvapi-sys = "0.1.3"
nvapi_sys_new = "=0.1.5"
ogos_audio = { path = "crates/ogos_audio" }
ogos_common = { path = "crates/ogos_common" }
ogos_config = { path = "crates/ogos_config" }
ogos_core = { path = "crates/ogos_core" }
ogos_discord = { path = "crates/ogos_discord" }
ogos_display = { path = "crates/ogos_display" }
ogos_err = { path = "crates/ogos_err" }
ogos_mki = { path = "crates/ogos_mki" }
ogos_video = { path = "crates/ogos_video" }
once_cell = "1.19.0"
qmk-via-api = { version = "0.5", default-features = false }
resize = { version = "0.8.8", default-features = false, features = ["std"] }
ron = "0.12.0"
serde = { version = "1.0.204", default-features = false, features = ["rc"] }
serde_json = "1.0.121"
simplelog = "0.12.1"
strum = { version = "0.27.1", features = ["derive"] }
sysinfo = { version = "0.37.2", default-features = false, features = ["multithread", "system"] }
wgpu = { version = "29.0.3", features = ["spirv"] }
which = "8.0.0"
widestring = { version = "1.2.0", default-features = false, features = ["std"] }
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
windows_061 = { version = "0.61", package = "windows", features = [
    "Win32_Devices_FunctionDiscovery"
] }
zenwebp = { version = "0.4.4", default-features = false }
zip = "8.6.0"
zune-jpeg = "0.5.15"
zune-png = "0.5.2"

[profile.public]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = "symbols"
